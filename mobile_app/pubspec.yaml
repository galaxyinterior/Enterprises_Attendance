name: mobile_attendance
description: "Enterprise Face Recognition Attendance System Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  flutter_tts: ^3.8.5
  intl: ^0.19.0
  supabase_flutter: ^2.5.4
  path_provider: ^2.1.2
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  share_plus: ^13.2.1
  lottie: ^3.3.3
  record: ^6.2.1
  audioplayers: ^6.7.1
  syncfusion_flutter_xlsio: ^34.2.5
  fl_chart: ^1.2.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/mobile_facenet.tflite
